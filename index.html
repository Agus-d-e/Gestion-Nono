<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.A.I.A - Taller</title>
  <style>
    /* Reset y base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #0f0f0f;
      color: #f5f5f5;
      line-height: 1.6;
    }

    /* Estilos para la página de inicio */
    body.landing {
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .center-box {
      text-align: center;
      background: #1a1a1a;
      padding: 30px 20px;
      border-radius: 15px;
      border: 2px solid #ff9800;
      box-shadow: 0 0 25px rgba(255, 153, 0, 0.3);
      width: 100%;
      max-width: 400px;
    }

    .center-box h1 {
      color: #ff9800;
      font-size: 2.5em;
      margin-bottom: 15px;
    }

    .center-box p {
      font-size: 1.1em;
      margin-bottom: 25px;
      color: #ffb84d;
    }

    .btn {
      display: inline-block;
      background-color: #ff9800;
      color: #000;
      padding: 12px 30px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      font-size: 1em;
    }

    .btn:hover {
      background-color: #ffa733;
      transform: scale(1.05);
    }

    /* Ocultar la gestión inicialmente */
    #gestion-container {
      display: none;
    }

    /* Estilos para el sistema de gestión */
    body:not(.landing) {
      background-color: #0f0f0f;
      padding: 0;
    }

    /* 🏷️ Header */
    header {
      background-color: #151515;
      border-bottom: 2px solid #ff9800;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-main {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      width: 100%;
    }

    header h1 {
      color: #ff9800;
      font-size: 1.5em;
      text-align: center;
      margin: 0;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .header-btn {
      background: #666;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9em;
      white-space: nowrap;
    }

    .header-btn.alert {
      background: #ff4444;
    }

    /* 📦 Panel selector y filtros */
    #panel {
      margin: 20px;
      background: #1a1a1a;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255, 153, 0, 0.3);
      border: 1px solid #ff9800;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .panel-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: end;
    }

    .filtro-group {
      flex: 1;
      min-width: 200px;
    }

    #panel label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ffb84d;
      font-size: 1.1em;
    }

    #selector, .filtro-input, .filtro-select {
      background-color: #222;
      color: #fff;
      border: 1px solid #ff9800;
      border-radius: 6px;
      padding: 10px;
      width: 100%;
      font-size: 1em;
    }

    .btn-filtro {
      background: #ff9800;
      color: #000;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
      font-size: 0.9em;
    }

    .btn-filtro:hover {
      background: #ffa733;
    }

    /* 📝 Formulario */
    #form-section {
      background: #1a1a1a;
      margin: 20px;
      padding: 20px;
      border-radius: 15px;
      border: 1px solid #ff9800;
      box-shadow: 0 0 25px rgba(255, 153, 0, 0.15);
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    #form-section h2 {
      color: #ff9800;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.3em;
    }

    #formulario {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #formulario label {
      color: #ffb84d;
      font-weight: bold;
      margin-bottom: 5px;
    }

    #formulario input, 
    #formulario select, 
    #formulario textarea {
      background-color: #222;
      border: 1px solid #ff9800;
      border-radius: 6px;
      color: #fff;
      padding: 12px;
      font-size: 1em;
      width: 100%;
    }

    #formulario textarea {
      min-height: 80px;
      resize: vertical;
    }

    #formulario button {
      margin-top: 10px;
      background-color: #ff9800;
      border: none;
      padding: 12px;
      color: #000;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      font-size: 1em;
    }

    #formulario button:hover {
      background-color: #ffa733;
    }

    /* 📊 Tabla - Responsive */
    #crud-container {
      margin: 20px;
      overflow-x: auto;
      background: #1a1a1a;
      border-radius: 15px;
      border: 1px solid #ff9800;
      box-shadow: 0 0 25px rgba(255, 153, 0, 0.15);
      padding: 15px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #333;
      white-space: nowrap;
    }

    th {
      background-color: #222;
      color: #ffb84d;
      font-weight: bold;
      position: sticky;
      top: 0;
    }

    td {
      color: #f5f5f5;
    }

    tr:hover {
      background-color: #2a2a2a;
    }

    .alerta-service {
      background-color: #ff4444 !important;
      color: white !important;
      font-weight: bold;
    }

    .alerta-service:hover {
      background-color: #cc3333 !important;
    }

    /* Botones de acción en tabla */
    .acciones-cell {
      white-space: nowrap;
    }

    .btn-accion {
      background: #ff9800;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      margin: 2px;
      font-size: 0.8em;
      min-width: 60px;
    }

    .btn-accion.eliminar {
      background: #ff4444;
    }

    .btn-accion:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    /* 🦶 Footer */
    footer {
      margin-top: 30px;
      padding: 20px;
      text-align: center;
      font-size: 0.9em;
      color: #888;
      border-top: 1px solid #222;
    }

    /* Modal de alertas */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background-color: #1a1a1a;
      margin: 5% auto;
      padding: 20px;
      border: 2px solid #ff9800;
      border-radius: 15px;
      width: 100%;
      max-width: 500px;
      color: #f5f5f5;
      box-shadow: 0 0 25px rgba(255, 153, 0, 0.3);
      position: relative;
    }

    .modal-header {
      color: #ff9800;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .modal-header h2 {
      font-size: 1.3em;
    }

    .modal-alerta {
      background-color: #ff4444;
      color: white;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border-left: 5px solid #ff9800;
      font-size: 0.9em;
    }

    .close {
      color: #aaa;
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
    }

    .close:hover {
      color: #ff9800;
    }

    /* Información responsive */
    .info-responsive {
      display: none;
      background: #333;
      color: #ffb84d;
      padding: 10px;
      margin: 10px 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.9em;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Media Queries para Responsive */
    @media (max-width: 768px) {
      .center-box {
        padding: 25px 15px;
      }
      
      .center-box h1 {
        font-size: 2em;
      }
      
      .header-content {
        padding: 0 10px;
      }
      
      .header-main {
        flex-direction: column;
        text-align: center;
      }
      
      header h1 {
        font-size: 1.3em;
      }
      
      .header-buttons {
        width: 100%;
        justify-content: center;
      }
      
      .header-btn {
        flex: 1;
        min-width: 120px;
        text-align: center;
      }

      .panel-row {
        flex-direction: column;
      }

      .filtro-group {
        min-width: 100%;
      }
      
      #panel, #form-section, #crud-container {
        margin: 10px;
        padding: 15px;
      }
      
      th, td {
        padding: 8px 10px;
        font-size: 0.9em;
      }
      
      .btn-accion {
        padding: 5px 8px;
        font-size: 0.75em;
        min-width: 50px;
        margin: 1px;
      }
      
      .modal-content {
        margin: 10% auto;
        padding: 15px;
      }
      
      .info-responsive {
        display: block;
      }
    }

    @media (max-width: 480px) {
      .center-box h1 {
        font-size: 1.8em;
      }
      
      .center-box p {
        font-size: 1em;
      }
      
      .btn {
        padding: 10px 20px;
        font-size: 0.9em;
      }
      
      header {
        padding: 10px 15px;
      }
      
      .header-btn {
        font-size: 0.8em;
        padding: 6px 10px;
      }
      
      #formulario input, 
      #formulario select, 
      #formulario textarea {
        padding: 10px;
      }
      
      th, td {
        padding: 6px 8px;
        font-size: 0.85em;
      }
      
      table {
        min-width: 500px;
      }
    }

    /* Scrollbar personalizado */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: #ff9800;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #ffa733;
    }
  </style>
</head>
<body class="landing">
  <!-- Página de Inicio -->
  <div class="center-box" id="inicio-container">
    <h1>C.A.I.A</h1>
    <p>Bienvenido al Centro de Asistencia Integrativa Automotriz</p>
    <button class="btn" onclick="mostrarGestion()">Entrar al sistema</button>
  </div>

  <!-- Sistema de Gestión (oculto inicialmente) -->
  <div id="gestion-container">
    <header>
      <div class="header-content">
        <div class="header-main">
          <h1>⚙️ Gestión del Taller</h1>
          <div class="header-buttons">
            <button class="header-btn" onclick="mostrarInicio()">← Volver</button>
            <button class="header-btn alert" onclick="verificarAlertasServices()">🚨 Ver Alertas</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <!-- Información para móviles -->
      <div class="info-responsive">
        💡 Desliza horizontalmente para ver toda la tabla en dispositivos móviles
      </div>

      <section id="panel">
        <div class="panel-row">
          <div class="filtro-group">
            <label for="selector">Seleccionar tabla:</label>
            <select id="selector">
              <option value="clientes">Clientes</option>
              <option value="mecanico">Mecánicos</option>
              <option value="especialidad">Especialidades</option>
              <option value="service">Service</option>
            </select>
          </div>
          
          <!-- Filtros para Clientes -->
          <div class="filtro-group" id="filtro-clientes" style="display: none;">
            <label for="filtro-nombre">Filtrar por nombre:</label>
            <input type="text" id="filtro-nombre" class="filtro-input" placeholder="Buscar por nombre...">
          </div>
          <div class="filtro-group" id="filtro-vehiculo" style="display: none;">
            <label for="filtro-vehiculo-input">Filtrar por vehículo:</label>
            <input type="text" id="filtro-vehiculo-input" class="filtro-input" placeholder="Buscar por vehículo...">
          </div>
          
          <!-- Filtros para Mecánicos -->
          <div class="filtro-group" id="filtro-especialidad" style="display: none;">
            <label for="filtro-especialidad-select">Filtrar por especialidad:</label>
            <select id="filtro-especialidad-select" class="filtro-select">
              <option value="">Todas las especialidades</option>
            </select>
          </div>
          
          <div class="filtro-group">
            <label>&nbsp;</label>
            <button class="btn-filtro" onclick="aplicarFiltros()">🔍 Aplicar Filtros</button>
          </div>
          <div class="filtro-group">
            <label>&nbsp;</label>
            <button class="btn-filtro" onclick="limpiarFiltros()">🗑️ Limpiar Filtros</button>
          </div>
        </div>
      </section>

      <section id="form-section">
        <h2 id="titulo-form">Agregar registro</h2>
        <form id="formulario"></form>
      </section>

      <section id="crud-container">
        <div class="table-container">
          <!-- La tabla se generará aquí dinámicamente -->
        </div>
      </section>
    </main>

    <footer>
      <p>Desarrollado con ❤️ y Supabase</p>
    </footer>
  </div>

  <!-- Modal para alertas -->
  <div id="modal-alertas" class="modal">
    <div class="modal-content">
      <span class="close" onclick="cerrarModal()">&times;</span>
      <div class="modal-header">
        <h2>🚨 Alertas de Services</h2>
      </div>
      <div id="contenido-alertas"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ====================== VARIABLES GLOBALES ======================
    let sistemaGestion = {
      supabase: null,
      intervaloAlertas: null,
      datosOriginales: {},
      filtrosActivos: {
        clientes: { nombre: '', vehiculo: '' },
        mecanico: { especialidad: '' }
      },
      tablaMap: {
        clientes: { name: "clientes", pk: "id_cliente" },
        mecanico: { name: "mecanicos", pk: "id_mec" },
        especialidad: { name: "especialidades", pk: "especialidad" },
        service: { name: "service", pk: "id" }
      },
      campos: {
        clientes: ["nombre", "vehiculo", "numero", "mecanico"],
        mecanico: ["nombre", "telefono", "especialidad"],
        especialidad: ["especialidad"],
        service: ["nombre", "vehiculo", "numero", "precio", "materiales", "fecha", "kilometros_actuales", "kilometros_ultima_distribucion"]
      }
    };

    // ====================== FUNCIONES GLOBALES ======================
    function mostrarGestion() {
      document.getElementById('inicio-container').style.display = 'none';
      document.getElementById('gestion-container').style.display = 'block';
      document.body.classList.remove('landing');
      
      inicializarSistemaGestion();
    }

    function mostrarInicio() {
      document.getElementById('inicio-container').style.display = 'block';
      document.getElementById('gestion-container').style.display = 'none';
      document.body.classList.add('landing');
      
      if (sistemaGestion.intervaloAlertas) {
        clearInterval(sistemaGestion.intervaloAlertas);
      }
    }

    function cerrarModal() {
      document.getElementById('modal-alertas').style.display = 'none';
    }

    // ====================== ALERTAS ======================
    async function verificarAlertasServices() {
      if (!sistemaGestion.supabase) {
        alert("El sistema no está inicializado. Entra primero al sistema de gestión.");
        return;
      }

      try {
        const { data: services, error } = await sistemaGestion.supabase
          .from("service")
          .select("*")
          .not("fecha", "is", null)
          .order("fecha", { ascending: true });

        if (error) throw error;

        const alertasTiempo = [];
        const alertasDistribucion = [];

        services.forEach(service => {
          // Alerta por tiempo (1 año)
          const fechaService = new Date(service.fecha);
          const hoy = new Date();
          const diferenciaMs = hoy - fechaService;
          const diferenciaDias = diferenciaMs / (1000 * 60 * 60 * 24);
          
          if (diferenciaDias >= 360 && diferenciaDias <= 370) {
            const anosTranscurridos = (diferenciaDias / 365).toFixed(1);
            alertasTiempo.push({
              id: service.id,
              nombre: service.nombre,
              vehiculo: service.vehiculo,
              numero: service.numero,
              fecha: service.fecha,
              diasTranscurridos: Math.floor(diferenciaDias),
              anosTranscurridos: anosTranscurridos,
              tipo: "tiempo"
            });
          }

          // Alerta por kilómetros de distribución (40,000 km)
          if (service.kilometros_actuales && service.kilometros_ultima_distribucion) {
            const kmRecorridos = service.kilometros_actuales - service.kilometros_ultima_distribucion;
            
            if (kmRecorridos >= 38000 && kmRecorridos <= 42000) {
              alertasDistribucion.push({
                id: service.id,
                nombre: service.nombre,
                vehiculo: service.vehiculo,
                numero: service.numero,
                kilometros_actuales: service.kilometros_actuales,
                kilometros_ultima_distribucion: service.kilometros_ultima_distribucion,
                kilometros_recorridos: kmRecorridos,
                tipo: "distribucion"
              });
            }
          }
        });

        mostrarAlertasServicesCombinadas(alertasTiempo, alertasDistribucion);
        
      } catch (error) {
        console.error("Error verificando alertas:", error);
        alert("Error al verificar alertas: " + error.message);
      }
    }

    function mostrarAlertasServicesCombinadas(alertasTiempo, alertasDistribucion) {
      const modal = document.getElementById('modal-alertas');
      const contenido = document.getElementById('contenido-alertas');
      
      let html = '';
      const totalAlertas = alertasTiempo.length + alertasDistribucion.length;
      
      if (totalAlertas === 0) {
        html = '<p>✅ No hay alertas en este momento.</p>';
      } else {
        html = `<p>🚨 <strong>${totalAlertas} alerta(s) activa(s):</strong></p>`;
        
        // Alertas por tiempo
        if (alertasTiempo.length > 0) {
          html += `<div style="margin: 15px 0; padding: 10px; background: #333; border-radius: 8px;">
                    <strong>📅 ALERTAS POR TIEMPO (${alertasTiempo.length})</strong>
                  </div>`;
          
          alertasTiempo.forEach((alerta, index) => {
            const fechaFormateada = new Date(alerta.fecha).toLocaleDateString('es-ES');
            html += `
              <div class="modal-alerta">
                <strong>⏰ ${index + 1}. ${alerta.nombre}</strong><br>
                📞 Teléfono: ${alerta.numero}<br>
                🚗 Vehículo: ${alerta.vehiculo}<br>
                📅 Fecha del service: ${fechaFormateada}<br>
                ⏰ Tiempo transcurrido: ${alerta.diasTranscurridos} días (${alerta.anosTranscurridos} años)<br>
                <br>
                <strong>📞 CONTACTAR AL CLIENTE PARA NUEVO SERVICE</strong>
              </div>
            `;
          });
        }
        
        // Alertas por distribución
        if (alertasDistribucion.length > 0) {
          html += `<div style="margin: 15px 0; padding: 10px; background: #333; border-radius: 8px;">
                    <strong>🔧 ALERTAS POR DISTRIBUCIÓN (${alertasDistribucion.length})</strong>
                  </div>`;
          
          alertasDistribucion.forEach((alerta, index) => {
            html += `
              <div class="modal-alerta">
                <strong>🔧 ${index + 1}. ${alerta.nombre}</strong><br>
                📞 Teléfono: ${alerta.numero}<br>
                🚗 Vehículo: ${alerta.vehiculo}<br>
                🛣️ Kilómetros actuales: ${alerta.kilometros_actuales} km<br>
                🔄 Último cambio distribución: ${alerta.kilometros_ultima_distribucion} km<br>
                📊 Kilómetros recorridos: ${alerta.kilometros_recorridos} km<br>
                <br>
                <strong>🔧 CONTACTAR AL CLIENTE PARA CAMBIO DE DISTRIBUCIÓN</strong>
              </div>
            `;
          });
        }
        
        html += `<p><strong>Acción requerida:</strong> Contactar a estos clientes según el tipo de alerta.</p>`;
      }
      
      contenido.innerHTML = html;
      modal.style.display = 'block';
    }

    // ====================== FILTROS ======================
    function mostrarFiltros(tabla) {
      document.getElementById('filtro-clientes').style.display = 'none';
      document.getElementById('filtro-vehiculo').style.display = 'none';
      document.getElementById('filtro-especialidad').style.display = 'none';

      if (tabla === 'clientes') {
        document.getElementById('filtro-clientes').style.display = 'block';
        document.getElementById('filtro-vehiculo').style.display = 'block';
      } else if (tabla === 'mecanico') {
        document.getElementById('filtro-especialidad').style.display = 'block';
        cargarEspecialidadesFiltro();
      }
    }

    async function cargarEspecialidadesFiltro() {
      try {
        const { data: especialidades, error } = await sistemaGestion.supabase
          .from("especialidades")
          .select("especialidad")
          .order("especialidad");

        if (error) throw error;

        const select = document.getElementById('filtro-especialidad-select');

      } else if (tabla === 'mecanico') {

          return !sistemaGestion.filtrosActivos.mecanico.especialidad || 
            item.especialidad === sistemaGestion.filtrosActivos.mecanico.especialidad;
        });
      }
      return datos;

            return;
          }

          // Convertir campos numéricos
          if (datos.numero) datos.numero = parseInt(datos.numero);
          if (datos.precio) datos.precio = parseFloat(datos.precio);
          if (datos.mecanico) datos.mecanico = parseInt(datos.mecanico);
          if (datos.kilometros_actuales) datos.kilometros_actuales = parseInt(datos.kilometros_actuales);

      // ✅ Validaciones de datos
      function validarDatos(tabla, datos) {
        const errores = [];
        
        if (tabla === "service") {
          const fechaService = new Date(datos.fecha);
          const hoy = new Date();
          hoy.setHours(0, 0, 0, 0);
          
          if (fechaService > hoy) {
            errores.push("❌ La fecha del service no puede ser futura");
          }
          
          const dosAniosAtras = new Date();
          dosAniosAtras.setFullYear(dosAniosAtras.getFullYear() - 2);
          
          if (fechaService < dosAniosAtras) {
            errores.push("❌ La fecha del service no puede ser de hace más de 2 años");
          }
          
          if (datos.precio && parseFloat(datos.precio) <= 0) {
            errores.push("❌ El precio debe ser mayor a 0");
          }
          
          if (datos.numero && datos.numero.length < 8) {
            errores.push("❌ El número de contacto debe tener al menos 8 dígitos");
          }
          
          if (datos.kilometros_actuales && parseInt(datos.kilometros_actuales) < 0) {
            errores.push("❌ Los kilómetros actuales no pueden ser negativos");
          }
          
          if (datos.kilometros_ultima_distribucion && parseInt(datos.kilometros_ultima_distribucion) < 0) {
            errores.push("❌ Los kilómetros de distribución no pueden ser negativos");
          }
          
          if (datos.kilometros_actuales && datos.kilometros_ultima_distribucion) {
            const kmActuales = parseInt(datos.kilometros_actuales);
            const kmDistribucion = parseInt(datos.kilometros_ultima_distribucion);
            
            if (kmActuales < kmDistribucion) {
              errores.push("❌ Los kilómetros actuales no pueden ser menores a los del último cambio de distribución");
            }
          }
        }
        
        return errores;
      }

      // 🧾 Renderizar tabla con filtros
      window.renderTablaConFiltros = async function(tabla) {
        try {
          const tablaReal = sistemaGestion.tablaMap[tabla].name;
          
          let data;
          let error;

          if (tabla === "clientes") {
            const { data: clientesData, error: clientesError } = await sistemaGestion.supabase
              .from(tablaReal)
              .select(`
                *,
                mecanicos (
                  nombre,
                  especialidad
                )
              `);
            
            data = clientesData;
            error = clientesError;
          } else {
            const { data: tablaData, error: tablaError } = await sistemaGestion.supabase.from(tablaReal).select("*");
            data = tablaData;
            error = tablaError;
          }
          
          if (error) {
            console.error("Error al cargar datos:", error);
            container.querySelector('.table-container').innerHTML = `<p>Error al cargar datos: ${error.message}</p>`;

          sistemaGestion.datosOriginales[tabla] = data;

          // Aplicar filtros
          const datosFiltrados = filtrarDatos(tabla, data);

          if (!datosFiltrados || datosFiltrados.length === 0) {
            container.querySelector('.table-container').innerHTML = "<p>No hay registros que coincidan con los filtros.</p>";
            return;
          }

          let html = `<h2>${tabla.toUpperCase()}`;
          
          if (datosFiltrados.length !== data.length) {
            html += ` <span style="font-size: 0.7em; color: #ffb84d;">(${datosFiltrados.length} de ${data.length} registros)</span>`;
          }
          html += `</h2>`;
          
          html += `<table><thead><tr>`;
          
          // Crear encabezados
          if (datosFiltrados.length > 0) {
            const firstRow = datosFiltrados[0];
            for (const col in firstRow) {
              let nombreColumna = col;
              
              if (tabla === "clientes" && col === "mecanico") {
                continue;
              }
              
              if (col === "id_mec" || col === "id_cliente" || col === "id") {
                nombreColumna = "ID";
              } else if (col === "mecanicos") {
                nombreColumna = "Mecánico";
              } else if (col === "kilometros_actuales") {
                nombreColumna = "Km Actuales";
              } else if (col === "kilometros_ultima_distribucion") {
                nombreColumna = "Km Última Distribución";
              } else if (col === "telefono") {
                nombreColumna = "Teléfono";
              } else if (col === "numero") {
                nombreColumna = "Número";
              } else if (col === "vehiculo") {
                nombreColumna = "Vehículo";
              } else if (col === "precio") {
                nombreColumna = "Precio";
              } else if (col === "fecha") {
                nombreColumna = "Fecha";
              } else if (col === "materiales") {
                nombreColumna = "Materiales";
              }
              
              html += `<th>${nombreColumna}</th>`;
            }
          }
          
          html += `<th>Acciones</th></tr></thead><tbody>`;

          // Crear filas
          for (const row of datosFiltrados) {
            const necesitaAlerta = tabla === "service" && esServiceConAlerta(row);
            
            html += `<tr${necesitaAlerta ? ' class="alerta-service"' : ''}>`;
            
            for (const col in row) {
              let valor = row[col];
              
              if (tabla === "clientes" && col === "mecanico") {
                continue;
              }
              
              if (col === "mecanicos" && tabla === "clientes" && row.mecanicos) {
                valor = `${row.mecanicos.nombre} - ${row.mecanicos.especialidad}`;
              } else if (col === "fecha" && valor) {
                valor = new Date(valor).toLocaleDateString('es-ES');
              } else if (col === "precio" && valor) {
                valor = `$${parseFloat(valor).toFixed(2)}`;
              } else if ((col === "kilometros_actuales" || col === "kilometros_ultima_distribucion") && valor) {
                valor = `${parseInt(valor).toLocaleString()} km`;
              } else if (valor === null || valor === undefined) {
                valor = "";
              } else if (col === "mecanicos") {
                continue;
              }
              
              html += `<td>${valor}</td>`;
            }
            
            const pk = sistemaGestion.tablaMap[tabla].pk;
            const pkValue = row[pk];
            
            html += `<td class="acciones-cell">`;
            
            if (tabla === "mecanico" || tabla === "clientes" || tabla === "service") {
              html += `<button class="btn-accion" onclick="window.editarRegistro('${tabla}', ${pkValue})">✏️ Editar</button>`;
            }
            
            if (tabla === "especialidad") {
              html += `<button class="btn-accion eliminar" onclick="window.borrar('${tabla}', '${pkValue}')">🗑️ Eliminar</button>`;
            } else {
              html += `<button class="btn-accion eliminar" onclick="window.borrar('${tabla}', ${pkValue})">🗑️ Eliminar</button>`;
            }
            
            html += `</td></tr>`;
          }

          html += `</tbody></table>`;
          
          if (tabla === "service") {
            const servicesConAlerta = datosFiltrados.filter(row => esServiceConAlerta(row));
            if (servicesConAlerta.length > 0) {
              html += `<div style="margin-top: 20px; padding: 15px; background: #ff4444; color: white; border-radius: 8px; border-left: 5px solid #ff9800;">
                <strong>🚨 ALERTA:</strong> ${servicesConAlerta.length} service(s) en rojo necesitan atención:<br>
                • Services que cumplen 1 año<br>
                • Vehículos que alcanzaron ~40,000 km desde último cambio de distribución
              </div>`;
            }
          }
          
          container.querySelector('.table-container').innerHTML = html;
          
        } catch (error) {
          console.error("Error en renderTabla:", error);
          container.querySelector('.table-container').innerHTML = `<p>Error al renderizar la tabla: ${error.message}</p>`;
        }
      }

      // Función auxiliar para determinar si un service necesita alerta
      function esServiceConAlerta(service) {
        if (!service.fecha) return false;
        
        const hoy = new Date();
        const fecha = new Date(service.fecha);
        const diferenciaMs = hoy - fecha;
        const diferenciaDias = diferenciaMs / (1000 * 60 * 60 * 24);
        
        const alertaTiempo = diferenciaDias >= 360 && diferenciaDias <= 370;
        
        let alertaDistribucion = false;
        if (service.kilometros_actuales && service.kilometros_ultima_distribucion) {
          const kmRecorridos = service.kilometros_actuales - service.kilometros_ultima_distribucion;
          alertaDistribucion = kmRecorridos >= 38000 && kmRecorridos <= 42000;
        }
        
        return alertaTiempo || alertaDistribucion;
      }

      // 🗑️ Eliminar registro
      window.borrar = async function(tabla, valor) {
        if (!confirm("¿Eliminar registro?")) return;
        
        try {
          const tablaReal = sistemaGestion.tablaMap[tabla].name;
          const pk = sistemaGestion.tablaMap[tabla].pk;
          
          const { error } = await sistemaGestion.supabase.from(tablaReal).delete().eq(pk, valor);
          
          if (error) {
            alert("Error al eliminar: " + error.message);
          } else {
            alert("Registro eliminado correctamente");
            await window.renderTablaConFiltros(tabla);
          }
        } catch (error) {
          alert("Error al eliminar: " + error.message);
        }
      }

      // Iniciar sistema de alertas automáticas
      function iniciarSistemaAlertas() {
        sistemaGestion.intervaloAlertas = setInterval(verificarAlertasServices, 12 * 60 * 60 * 1000);
      }

      // 📂 Eventos
      selector.addEventListener("change", (e) => {
        tablaActual = e.target.value;
        renderFormulario(tablaActual);
        window.renderTablaConFiltros(tablaActual);
      });

      // Inicializar el sistema de gestión
      tablaActual = selector.value;
      renderFormulario(tablaActual);
      window.renderTablaConFiltros(tablaActual);
      
      // Iniciar sistema de alertas automáticas
      iniciarSistemaAlertas();
    }
  </script>
</body>
</html>
